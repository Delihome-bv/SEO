<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>Pagina niet gevonden (404) | CanDo</title>
<meta name="description" content="Deze pagina bestaat niet of is verplaatst. Ga terug naar de homepage, bekijk alle categorieën of zoek je product. CanDo helpt je weer op weg.">
<link rel="stylesheet" href="https://www.cando.eu/static/version1781016365/frontend/WeProvide/Cando/nl_NL/css/fonts/dax-pro.css">
<style>
:root{--text:#222;--muted:#666b70;--accent:#F7901E;--accent-dark:#d95f18;--border:#e5ddd3;--soft:#f7f2ea;--soft2:#fbfaf7;--radius:8px;--shadow:0 10px 24px rgba(18,27,33,.05)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
.page{overflow-x:hidden;min-height:70vh;display:flex;align-items:center}
h1,h2,.btn,.eyebrow,.code{font-family:ff-dax-pro,"Dax Pro",Arial,sans-serif}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:56px 18px;text-align:center}
.code{color:var(--accent);font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em}
h1{margin:8px 0 10px;font-size:32px;line-height:1.1}
p{margin:0 auto;color:#414141;font-size:16px;line-height:1.72;max-width:520px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #d9d4cc;border-radius:999px;padding:0 18px;min-height:52px;max-width:480px;margin:22px auto 0}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:700;font-size:16px;border:1.5px solid transparent;transition:.18s ease}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn-tertiary{background:transparent;border-color:var(--text);color:var(--text)}
.btn-tertiary:hover{border-color:var(--accent);color:var(--accent)}
.quick{margin-top:34px;text-align:left}
.quick__t{font-family:ff-dax-pro,"Dax Pro",Arial,sans-serif;font-weight:700;font-size:14px;text-align:center;margin-bottom:14px}
.quick__grid{display:grid;gap:10px;grid-template-columns:1fr}
.ql{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--text);font-weight:700;box-shadow:var(--shadow);transition:border-color .2s ease}
.ql:hover{border-color:var(--accent)}
.ql::after{content:"›";color:var(--accent);font-size:20px}
@media(min-width:640px){.code{font-size:96px}h1{font-size:38px}.quick__grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<!-- SYSTEEMPAGINA 404. noindex,follow. Geen header/footer. -->
<main class="page">
  <div class="wrap">
    <div class="code">404</div>
    <h1>Pagina niet gevonden</h1>
    <p>De pagina bestaat niet of is verplaatst. Kies hieronder een logisch startpunt of zoek waar je naar op zoek was.</p>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" placeholder="Waar ben je naar op zoek?" aria-label="Zoeken">
    </div>
    <div class="btn-row">
      <a class="btn btn-primary" href="/">Naar de homepage</a>
      <a class="btn btn-tertiary" href="/categorieen/">Bekijk alle categorieën</a>
    </div>
    <div class="quick">
      <div class="quick__t">Of ga direct naar</div>
      <div class="quick__grid">
        <a class="ql" href="/categorieen/">Alle categorieën</a>
        <a class="ql" href="/inspiratie/">Inspiratie</a>
        <a class="ql" href="/hulp-en-advies/">Hulp &amp; advies</a>
        <a class="ql" href="/verkooppunten/">Verkooppunten</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
